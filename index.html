<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1B2A4A">
<title>Academia Empresarial Bolivia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3F0;--sf:#FFF;--pr:#1B2A4A;--ac:#C8943C;--tx:#1A1A2E;--t2:#6B7280;--t3:#9CA3AF;--ok:#059669;--ok-bg:#ECFDF5;--wn:#D97706;--er:#DC2626;--bd:#E5E7EB;--sh:0 2px 12px rgba(0,0,0,.06);--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.dn{font-family:'Playfair Display',serif}.hidden{display:none!important}
.load-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.load-screen .icon{font-size:3rem;margin-bottom:12px}
.load-screen .title{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--pr);font-weight:700;margin-bottom:4px}
.load-screen .sub{color:var(--t2);font-size:.95rem;margin-bottom:20px}
.btn{padding:14px 24px;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;background:var(--pr);color:#fff;font-family:'DM Sans',sans-serif}
.app{display:none;min-height:100vh;padding-bottom:72px}
.hdr{background:var(--pr);color:#fff;padding:18px 20px 14px;position:sticky;top:0;z-index:50}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700}
.hdr-sub{font-size:.78rem;opacity:.75;margin-top:2px}
.hdr-back{display:flex;align-items:center;gap:10px}
.hdr-back button{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:4px}
.main{padding:16px}
.card{background:var(--sf);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.section-title{font-size:.78rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;margin-top:6px}
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:.95rem}
.search-wrap{margin-bottom:16px}
.search-input{width:100%;padding:14px 18px;border:2px solid var(--bd);border-radius:14px;font-size:.95rem;font-family:'DM Sans',sans-serif;outline:none;background:var(--sf)}
.search-input:focus{border-color:var(--pr)}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mod-card{background:#1A4D2E;background:linear-gradient(135deg,#0F2B1C,#1A4D2E);border-radius:14px;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;box-shadow:0 4px 14px rgba(13,43,26,.35);position:relative;min-height:112px}
.mod-card:active{transform:scale(.97)}
.mod-icon{font-size:1.6rem;flex-shrink:0;line-height:1}
.mod-name{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:700;color:#FFFFFF;line-height:1.25;flex:1;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.mod-desc{display:none}
.mod-count{position:absolute;top:8px;right:10px;background:#8FD4A8;color:#0F2B1C;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:8px}
.content-item{background:var(--sf);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh)}
.ci-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.ci-title{font-weight:700;font-size:.92rem;flex:1}
.ci-type{font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:8px;flex-shrink:0;text-transform:uppercase}
.type-leccion{background:#DBEAFE;color:#1E40AF}
.type-comparacion{background:#FCE7F3;color:#9D174D}
.type-explicacion{background:#D1FAE5;color:#065F46}
.type-guia{background:#FEF3C7;color:#92400E}
.type-nota{background:#E5E7EB;color:#374151}
.type-procedimiento{background:#EDE9FE;color:#5B21B6}
.type-obligacion{background:#FEE2E2;color:#991B1B}
.type-caso{background:#CCFBF1;color:#134E4A}
.type-glosario{background:#E5E7EB;color:#374151}
.ci-summary{font-size:.82rem;color:var(--t2);line-height:1.4;margin-top:2px}
.detail-header{margin-bottom:16px}
.detail-type{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:8px;display:inline-block;margin-bottom:8px;text-transform:uppercase}
.detail-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;line-height:1.2;margin-bottom:8px}
.detail-body{line-height:1.7;font-size:.95rem}
.detail-body h3{font-size:1.05rem;font-weight:700;color:var(--pr);margin:16px 0 8px}
.detail-body ol{margin:12px 0 12px 20px}
.detail-body li{margin-bottom:6px}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{background:var(--bg);padding:4px 12px;border-radius:20px;font-size:.75rem;color:var(--t2)}
.detail-actions{display:flex;gap:10px;margin-top:16px}
.detail-fav{background:var(--sf);border:2px solid var(--bd);padding:10px 18px;border-radius:12px;cursor:pointer;font-size:.85rem;font-weight:600}
.detail-fav.on{background:var(--ac);border-color:var(--ac);color:#fff}
.norm-item{background:var(--bg);padding:12px 14px;border-radius:10px;margin-bottom:8px;font-size:.85rem;line-height:1.5}
.calc-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px}
.calc-tab{flex-shrink:0;padding:10px 16px;border:1px solid var(--bd);border-radius:20px;background:var(--sf);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.calc-tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.calc-form label{display:block;font-size:.82rem;font-weight:600;color:var(--t2);margin-bottom:4px;margin-top:12px}
.calc-form input{width:100%;padding:12px;border:2px solid var(--bd);border-radius:10px;font-size:.95rem;font-family:'DM Sans',sans-serif;outline:none;background:var(--bg)}
.calc-result{background:var(--ok-bg);padding:16px;border-radius:12px;margin-top:16px;text-align:center}
.calc-result .value{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--ok)}
.calc-result .label{font-size:.85rem;color:var(--t2);margin-top:4px}
.calc-result .formula{font-size:.78rem;color:var(--t3);margin-top:8px;font-style:italic}
.prog-bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;border-radius:4px;background:var(--ok)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);display:flex;justify-content:space-around;align-items:center;padding:6px 0 10px;box-shadow:0 -2px 16px rgba(0,0,0,.08);z-index:100;border-top:1px solid var(--bd)}
.bnav-btn{display:flex;flex-direction:column;align-items:center;background:none;border:none;color:var(--t3);font-size:.62rem;cursor:pointer;padding:4px 8px;gap:2px}
.bnav-btn.on{color:var(--pr)}
.bnav-btn svg{width:22px;height:22px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.quick-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-size:.72rem;color:var(--tx);gap:4px;font-weight:600}
.quick-btn i{font-size:1.4rem;font-style:normal}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px}
.chip{flex-shrink:0;padding:7px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--sf);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
</style>
</head>
<body>
<div class="load-screen" id="loading">
<div class="icon"></div>
<div class="title dn">Academia Empresarial</div>
<div class="sub">Bolivia · Conocimiento empresarial</div>
<div id="loadMsg">Cargando contenido...</div>
</div>
<div class="app" id="app">
<div class="hdr" id="appHdr"></div>
<div class="main" id="main"></div>
<div class="bnav">
<button class="bnav-btn on" onclick="goView('home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Inicio</button>
<button class="bnav-btn" onclick="goView('search',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Buscar</button>
<button class="bnav-btn" onclick="goView('calc',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>Calcular</button>
<button class="bnav-btn" onclick="goView('fav',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Fav</button>
<button class="bnav-btn" onclick="goView('prog',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Progreso</button>
</div>
</div>
<script>
var GAS='https://script.google.com/macros/s/AKfycbzpi6pATvU4yeMlxG92cYmDxDJASLzjnJHvQ0CfQg-hY3XYgHGFPOKfrYdtP_6qGuq6BQ/exec';
var DATA={modulos:[],contenidos:[],procedimientos:[],obligaciones:[],casos:[],glosario:[]};
var FAV=JSON.parse(localStorage.getItem('acad_fav')||'[]');
var PROG=JSON.parse(localStorage.getItem('acad_prog')||'{}');
var V='home',cM='',cC='',cCT='',cT='todo',sQ='',cTab='margen';
var MODS=[
{id:'mod01',nombre:'Constitución y Tipos de Empresa',descripcion:'Derecho societario y formas empresariales',icono:''},
{id:'mod02',nombre:'Contabilidad e Impuestos',descripcion:'SIAT facturación declaraciones',icono:''},
{id:'mod03',nombre:'Derecho Laboral',descripcion:'Contratación personal liquidaciones',icono:''},
{id:'mod04',nombre:'Contratos y Litigios',descripcion:'Civiles comerciales reclamaciones',icono:''},
{id:'mod05',nombre:'Finanzas Empresariales',descripcion:'Bancos préstamos crédito',icono:''},
{id:'mod06',nombre:'Compras y Ventas',descripcion:'Inventario proveedores importaciones',icono:''},
{id:'mod07',nombre:'Obligaciones Administrativas',descripcion:'Registros licencias cumplimiento',icono:''},
{id:'mod08',nombre:'Protección Patrimonial',descripcion:'Seguros riesgos responsabilidad',icono:''},
{id:'mod09',nombre:'Gestión Documental',descripcion:'Trámites plazos calendario',icono:''},
{id:'mod10',nombre:'Casos y Evaluación',descripcion:'Ejercicios glosario evaluaciones',icono:''}
];
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
async function init(){
try{
var r=await fetch(GAS+'?action=getData');
var d=await r.json();
if(d.ok)DATA=d;
}catch(e){console.log(e)}
document.getElementById('loading').classList.add('hidden');
if(!DATA.modulos||!DATA.modulos.length)DATA.modulos=MODS.slice();
document.getElementById('app').style.display='block';
setH('home');showHome();
}
function goView(v,btn){
document.querySelectorAll('.bnav-btn').forEach(function(el){el.classList.remove('on')});
if(btn)btn.classList.add('on');
V=v;
if(v==='home'){setH('home');showHome()}
if(v==='search'){setH('search');showSearch()}
if(v==='calc'){setH('calc');showCalc()}
if(v==='fav'){setH('fav');showFav()}
if(v==='prog'){setH('prog');showProg()}
}
function goBack(){
if(V==='content'){V='module';setH('module');showModule()}
else{V='home';setH('home');showHome()}
}
function setH(v){
var h='';
if(v==='home')h='<div class="hdr-title dn"> Academia Empresarial</div><div class="hdr-sub">Bolivia · Conocimiento empresarial</div>';
if(v==='module'){
var m=DATA.modulos.find(function(x){return x.id===cM});
if(m)h='<div class="hdr-back"><button onclick="goBack()"></button><div><div class="hdr-title dn">'+m.icono+' '+esc(m.nombre)+'</div><div class="hdr-sub">'+esc(m.descripcion||'')+'</div></div></div>';
}
if(v==='content')h='<div class="hdr-back"><button onclick="goBack()"></button><div><div class="hdr-title dn">Contenido</div></div></div>';
if(v==='search')h='<div class="hdr-title dn"> Buscar</div><div class="hdr-sub">Encuentra temas y procedimientos</div>';
if(v==='calc')h='<div class="hdr-title dn"> Calculadoras</div><div class="hdr-sub">Herramientas financieras</div>';
if(v==='fav')h='<div class="hdr-title dn"> Favoritos</div><div class="hdr-sub">Tu contenido guardado</div>';
if(v==='prog')h='<div class="hdr-title dn"> Progreso</div><div class="hdr-sub">Tu avance de aprendizaje</div>';
document.getElementById('appHdr').innerHTML=h;
}
function showHome(){
var h='<input class="search-input" placeholder=" Buscar..." onkeydown="if(event.key===\'Enter\'){sQ=this.value;goView(\'search\',document.querySelectorAll(\'.bnav-btn\')[1])}">';
h+='<div class="section-title">Acceso rápido</div><div class="quick-grid">';
h+='<div class="quick-btn" onclick="goView(\'calc\',document.querySelectorAll(\'.bnav-btn\')[2])"><i></i>Calculadoras</div>';
h+='<div class="quick-btn" onclick="showGlos()"><i></i>Glosario</div>';
h+='<div class="quick-btn" onclick="showCasos()"><i></i>Casos</div>';
h+='</div><div class="section-title">Módulos de aprendizaje</div><div class="mod-grid">';
DATA.modulos.forEach(function(m){
var c=mCount(m.id);
h+='<div class="mod-card" onclick="openMod(\''+m.id+'\')">';
if(c>0)h+='<div class="mod-count">'+c+'</div>';
h+='<div class="mod-icon">'+m.icono+'</div>';
h+='<div class="mod-name">'+esc(m.nombre)+'</div>';
h+='</div>';
});
h+='</div>';
document.getElementById('main').innerHTML=h;
}
function mCount(id){
var c=0;
DATA.contenidos.forEach(function(x){if(x.moduloId===id&&x.estado!=='borrador')c++});
DATA.procedimientos.forEach(function(x){if(x.moduloId===id)c++});
DATA.obligaciones.forEach(function(x){if(x.moduloId===id)c++});
DATA.casos.forEach(function(x){if(x.moduloId===id)c++});
return c;
}
function openMod(id){cM=id;cT='todo';V='module';setH('module');showModule()}
function showModule(){
var h='<div class="filter-chips">';
var tp=[{i:'todo',l:'Todo'},{i:'leccion',l:'Lecc.'},{i:'comparacion',l:'Comp.'},{i:'explicacion',l:'Expl.'},{i:'guia',l:'Guías'},{i:'nota',l:'Notas'},{i:'procedimiento',l:'Proced.'},{i:'obligacion',l:'Oblig.'},{i:'caso',l:'Casos'}];
tp.forEach(function(t){h+='<button class="chip'+(cT===t.i?' on':'')+'" onclick="fT(\''+t.i+'\')">'+t.l+'</button>'});
h+='</div>';
var items=getItems(cM,cT);
if(!items.length)h+='<div class="empty"> Sin contenido disponible</div>';
else items.forEach(function(it){h+=card(it)});
document.getElementById('main').innerHTML=h;
}
function fT(t){cT=t;showModule()}
function getItems(mid,type){
var a=[];
if(type==='todo'||!type){
DATA.contenidos.forEach(function(x){if(x.moduloId===mid&&x.estado!=='borrador')a.push(Object.assign({},x,{_t:'contenido'}))});
DATA.procedimientos.forEach(function(x){if(x.moduloId===mid)a.push(Object.assign({},x,{_t:'procedimiento',titulo:x.titulo,resumen:x.resumen,tipo:'procedimiento'}))});
DATA.obligaciones.forEach(function(x){if(x.moduloId===mid)a.push(Object.assign({},x,{_t:'obligacion',titulo:x.titulo,resumen:x.descripcion,tipo:'obligacion'}))});
DATA.casos.forEach(function(x){if(x.moduloId===mid)a.push(Object.assign({},x,{_t:'caso',titulo:x.titulo,resumen:x.descripcion,tipo:'caso'}))});
}else if(type==='procedimiento'){DATA.procedimientos.forEach(function(x){if(x.moduloId===mid)a.push(Object.assign({},x,{_t:'procedimiento',titulo:x.titulo,resumen:x.resumen,tipo:'procedimiento'}))})}
else if(type==='obligacion'){DATA.obligaciones.forEach(function(x){if(x.moduloId===mid)a.push(Object.assign({},x,{_t:'obligacion',titulo:x.titulo,resumen:x.descripcion,tipo:'obligacion'}))})}
else if(type==='caso'){DATA.casos.forEach(function(x){if(x.moduloId===mid)a.push(Object.assign({},x,{_t:'caso',titulo:x.titulo,resumen:x.descripcion,tipo:'caso'}))})}
else{DATA.contenidos.forEach(function(x){if(x.moduloId===mid&&x.tipo===type&&x.estado!=='borrador')a.push(Object.assign({},x,{_t:'contenido'}))})}
return a;
}
function card(it){
var tb=it._t||it.tipo||'nota';
var tl={leccion:'Lección',comparacion:'Comparación',explicacion:'Explicación',guia:'Guía',nota:'Nota',procedimiento:'Procedimiento',obligacion:'Obligación',caso:'Caso',glosario:'Glosario'};
var sum=esc(it.resumen||'');if(sum.length>120)sum=sum.substring(0,120)+'...';
return '<div class="content-item" onclick="openC(\''+it.id+'\',\''+tb+'\')"><div class="ci-header"><div class="ci-title">'+esc(it.titulo||it.termino||'')+'</div><div class="ci-type type-'+tb+'">'+(tl[tb]||tb)+'</div></div><div class="ci-summary">'+sum+'</div></div>';
}
function openC(id,type){cC=id;cCT=type;V='content';setH('content');showContent(id,type)}
function showContent(id,type){
var item=null;
if(type==='procedimiento')item=DATA.procedimientos.find(function(x){return x.id===id});
else if(type==='obligacion')item=DATA.obligaciones.find(function(x){return x.id===id});
else if(type==='caso')item=DATA.casos.find(function(x){return x.id===id});
else item=DATA.contenidos.find(function(x){return x.id===id});
if(!item){document.getElementById('main').innerHTML='<div class="empty">No encontrado</div>';return}
var tl={leccion:'Lección',comparacion:'Comparación',explicacion:'Explicación',guia:'Guía',nota:'Nota',procedimiento:'Procedimiento',obligacion:'Obligación',caso:'Caso'};
var tb=type||item.tipo||'nota';
var h='<div class="detail-header"><div class="detail-type type-'+tb+'">'+(tl[tb]||tb)+'</div><div class="detail-title">'+esc(item.titulo||item.termino||'')+'</div></div><div class="card">';
if(item.contenido)h+='<div class="detail-body">'+item.contenido+'</div>';
else if(item.descripcion)h+='<div class="detail-body">'+item.descripcion+'</div>';
if(item.pasos){h+='<h3>Pasos a seguir</h3><ol>';item.pasos.split('\n').forEach(function(s){if(s.trim())h+='<li>'+esc(s)+'</li>'});h+='</ol>'}
if(item.solucion)h+='<h3>Solución</h3><div>'+item.solucion+'</div>';
h+='</div>';
if(item.documentos)h+='<div class="card"><div class="section-title"> Documentos</div><div>'+item.documentos.replace(/\n/g,'<br>')+'</div></div>';
if(item.normas||item.norma)h+='<div class="card"><div class="section-title"> Normas</div><div class="norm-item">'+(item.normas||item.norma).replace(/\n/g,'<br>')+'</div></div>';
if(item.tags){var tg=item.tags.split(',').filter(function(t){return t.trim()});if(tg.length){h+='<div class="detail-tags">';tg.forEach(function(t){h+='<div class="tag">'+esc(t.trim())+'</div>'});h+='</div>'}}
h+='<div class="detail-actions"><button class="detail-fav'+(FAV.indexOf(id)>=0?' on':'')+'" onclick="togF(\''+id+'\')">'+(FAV.indexOf(id)>=0?' Guardado':' Guardar')+'</button><button class="detail-fav" onclick="markR(\''+id+'\')"> Estudiado</button></div>';
document.getElementById('main').innerHTML=h;
}
function showSearch(){
var h='<input class="search-input" id="si" placeholder=" Buscar..." value="'+esc(sQ)+'" oninput="sQ=this.value;doSearch(this.value)"><div id="sr"></div>';
document.getElementById('main').innerHTML=h;if(sQ)doSearch(sQ);
}
function doSearch(q){
var el=document.getElementById('sr');if(!el)return;
if(!q||q.length<2){el.innerHTML='<div class="empty">Escribe al menos 2 letras</div>';return}
var ql=q.toLowerCase(),r=[];
DATA.contenidos.forEach(function(x){if((x.titulo+x.resumen+x.contenido+x.tags+x.normas).toLowerCase().indexOf(ql)>=0)r.push(Object.assign({},x,{_t:'contenido'}))});
DATA.procedimientos.forEach(function(x){if((x.titulo+x.resumen+x.pasos).toLowerCase().indexOf(ql)>=0)r.push(Object.assign({},x,{_t:'procedimiento',titulo:x.titulo,resumen:x.resumen,tipo:'procedimiento'}))});
DATA.obligaciones.forEach(function(x){if((x.titulo+x.descripcion+x.sujeto+x.norma).toLowerCase().indexOf(ql)>=0)r.push(Object.assign({},x,{_t:'obligacion',titulo:x.titulo,resumen:x.descripcion,tipo:'obligacion'}))});
DATA.casos.forEach(function(x){if((x.titulo+x.descripcion+x.solucion).toLowerCase().indexOf(ql)>=0)r.push(Object.assign({},x,{_t:'caso',titulo:x.titulo,resumen:x.descripcion,tipo:'caso'}))});
DATA.glosario.forEach(function(x){if((x.termino+x.definicion).toLowerCase().indexOf(ql)>=0)r.push(Object.assign({},x,{_t:'glosario',titulo:x.termino,resumen:x.definicion,tipo:'glosario'}))});
if(!r.length){el.innerHTML='<div class="empty">Sin resultados</div>';return}
el.innerHTML=r.map(function(x){return card(x)}).join('');
}
function showGlos(){
V='glosario';setH('search');
var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button onclick="goView(\'home\',document.querySelectorAll(\'.bnav-btn\')[0])" style="background:none;border:none;font-size:1.2rem;cursor:pointer"></button><div style="font-weight:700;font-size:1.15rem"> Glosario</div></div>';
if(!DATA.glosario.length)h+='<div class="empty">Sin términos</div>';
else DATA.glosario.slice().sort(function(a,b){return a.termino.localeCompare(b.termino)}).forEach(function(g){
h+='<div class="card"><div style="font-weight:700;font-size:.95rem;color:var(--pr);margin-bottom:4px">'+esc(g.termino)+'</div><div style="font-size:.88rem;color:var(--t2);line-height:1.5">'+esc(g.definicion)+'</div></div>';
});
document.getElementById('main').innerHTML=h;
}
function showCasos(){
V='casos';setH('search');
var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button onclick="goView(\'home\',document.querySelectorAll(\'.bnav-btn\')[0])" style="background:none;border:none;font-size:1.2rem;cursor:pointer"></button><div style="font-weight:700;font-size:1.15rem"> Casos Prácticos</div></div>';
if(!DATA.casos.length)h+='<div class="empty">Sin casos</div>';
else DATA.casos.forEach(function(c){h+=card(Object.assign({},c,{_t:'caso',titulo:c.titulo,resumen:c.descripcion,tipo:'caso'}))});
document.getElementById('main').innerHTML=h;
}
function showCalc(){
var h='<div class="calc-tabs">';
var tabs=[{i:'margen',l:'Margen'},{i:'equilibrio',l:'Equilibrio'},{i:'capital',l:'Capital'},{i:'prestamo',l:'Préstamo'},{i:'rentab',l:'Rentab.'},{i:'endeuda',l:'Endeud.'}];
tabs.forEach(function(t){h+='<button class="calc-tab'+(cTab===t.i?' on':'')+'" onclick="swC(\''+t.i+'\')">'+t.l+'</button>'});
h+='</div><div class="card"><div id="cf"></div></div><div id="cr"></div>';
document.getElementById('main').innerHTML=h;cForm();
}
function swC(t){cTab=t;showCalc()}
function cForm(){
var el=document.getElementById('cf');if(!el)return;
var h='',t=cTab;
if(t==='margen')h='<b>Margen Bruto</b><div class="calc-form"><label>Ingresos ($)</label><input type="number" id="i1"><label>Costo ($)</label><input type="number" id="i2"></div><br><button class="btn" onclick="doCalc()">Calcular</button>';
if(t==='equilibrio')h='<b>Punto Equilibrio</b><div class="calc-form"><label>Costos fijos ($)</label><input type="number" id="i1"><label>Precio unitario ($)</label><input type="number" id="i2"><label>Costo variable ($)</label><input type="number" id="i3"></div><br><button class="btn" onclick="doCalc()">Calcular</button>';
if(t==='capital')h='<b>Capital de Trabajo</b><div class="calc-form"><label>Activo corriente ($)</label><input type="number" id="i1"><label>Pasivo corriente ($)</label><input type="number" id="i2"></div><br><button class="btn" onclick="doCalc()">Calcular</button>';
if(t==='prestamo')h='<b>Cuota Préstamo</b><div class="calc-form"><label>Monto ($)</label><input type="number" id="i1"><label>Tasa anual (%)</label><input type="number" id="i2" step="0.01"><label>Plazo (meses)</label><input type="number" id="i3"></div><br><button class="btn" onclick="doCalc()">Calcular</button>';
if(t==='rentab')h='<b>Rentabilidad</b><div class="calc-form"><label>Ganancia ($)</label><input type="number" id="i1"><label>Inversión ($)</label><input type="number" id="i2"></div><br><button class="btn" onclick="doCalc()">Calcular</button>';
if(t==='endeuda')h='<b>Endeudamiento</b><div class="calc-form"><label>Deuda ($)</label><input type="number" id="i1"><label>Patrimonio ($)</label><input type="number" id="i2"></div><br><button class="btn" onclick="doCalc()">Calcular</button>';
el.innerHTML=h;
}
function doCalc(){
var el=document.getElementById('cr');if(!el)return;
var t=cTab,v1=parseFloat(document.getElementById('i1').value)||0,v2=parseFloat(document.getElementById('i2').value)||0,v3=0;
if(document.getElementById('i3'))v3=parseFloat(document.getElementById('i3').value)||0;
var lb='',vl='',fm='';
if(t==='margen'&&v1>0){var m=(v1-v2)/v1*100;lb='Margen Bruto';vl=m.toFixed(2)+'%';fm='$'+v1+' - $'+v2+' / $'+v1+' x 100'}
else if(t==='equilibrio'&&v2>v3){var u=v1/(v2-v3);lb='Unidades';vl=Math.ceil(u);fm='$'+v1+' / ($'+v2+' - $'+v3+')'}
else if(t==='capital'){lb='Capital';vl='$'+(v1-v2).toFixed(2);fm='$'+v1+' - $'+v2}
else if(t==='prestamo'&&v1>0&&v3>0){var ir=v2/12/100;var cuo=ir>0?v1*(ir/(1-Math.pow(1+ir,-v3))):v1/v3;lb='Cuota mensual';vl='$'+cuo.toFixed(2);fm='Total: $'+(cuo*v3).toFixed(2)}
else if(t==='rentab'&&v2>0){lb='Rentabilidad';vl=(v1/v2*100).toFixed(2)+'%';fm='$'+v1+' / $'+v2+' x 100'}
else if(t==='endeuda'&&v2>0){var e=v1/v2*100;lb='Endeudamiento';vl=e.toFixed(2)+'%';fm=e<=100?'Saludable':e<=200?'Moderado':'Alto riesgo'}
else{el.innerHTML='<div class="empty">Completa los campos</div>';return}
el.innerHTML='<div class="calc-result"><div class="label">'+lb+'</div><div class="value">'+vl+'</div><div class="formula">'+fm+'</div></div>';
}
function togF(id){var i=FAV.indexOf(id);if(i>=0)FAV.splice(i,1);else FAV.push(id);localStorage.setItem('acad_fav',JSON.stringify(FAV));if(V==='content')showContent(cC,cCT);if(V==='fav')showFav()}
function showFav(){
var h='';
if(!FAV.length){h='<div class="empty"> Sin favoritos</div>';document.getElementById('main').innerHTML=h;return}
FAV.forEach(function(id){
var item=DATA.contenidos.find(function(x){return x.id===id});
if(!item)item=DATA.procedimientos.find(function(x){return x.id===id});
if(!item)item=DATA.obligaciones.find(function(x){return x.id===id});
if(!item)item=DATA.casos.find(function(x){return x.id===id});
if(item)h+=card(Object.assign({},item,{_t:item.tipo||item._t||'nota',titulo:item.titulo,resumen:item.resumen||item.descripcion||''}));
});
document.getElementById('main').innerHTML=h;
}
function markR(id){PROG[id]=true;localStorage.setItem('acad_prog',JSON.stringify(PROG));var el=document.querySelector('.detail-fav:last-child');if(el){el.textContent=' Estudiado';el.style.background='var(--ok-bg)';el.style.borderColor='var(--ok)'}}
function showProg(){
var total=DATA.contenidos.length+DATA.procedimientos.length+DATA.obligaciones.length+DATA.casos.length;
var read=Object.keys(PROG).length;
var pct=total>0?Math.round(read/total*100):0;
var h='<div class="card" style="text-align:center"><div style="font-size:.85rem;color:var(--t2)">Progreso general</div><div class="dn" style="font-size:2.5rem;font-weight:700;color:var(--pr)">'+pct+'%</div><div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div></div><div class="section-title">Por módulo</div>';
DATA.modulos.forEach(function(m){
var mT=mCount(m.id),mR=0;
getItems(m.id,'todo').forEach(function(it){if(PROG[it.id])mR++});
var mp=mT>0?Math.round(mR/mT*100):0;
h+='<div class="card"><div style="font-weight:700;font-size:.88rem;display:flex;justify-content:space-between"><span>'+m.icono+' '+esc(m.nombre)+'</span><span style="color:var(--ok)">'+mp+'%</span></div><div class="prog-bar"><div class="prog-fill" style="width:'+mp+'%"></div></div></div>';
});
document.getElementById('main').innerHTML=h;
}
document.addEventListener('DOMContentLoaded',init);
</script>
