<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUAVA Tania Empresa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B2A4A'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='serif' font-size='22' font-weight='700' fill='%23C8943C'%3EDT%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F2;--sf:#FFF;--pr:#1B2A4A;--ac:#C8943C;--tx:#1A1A2E;--t2:#6B7280;--t3:#9CA3AF;--ok:#059669;--wn:#D97706;--er:#DC2626;--bd:#E5E7EB;--sh:0 2px 12px rgba(0,0,0,.06);--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.dn{font-family:'Playfair Display',serif}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px}
.login-box{background:var(--sf);border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:var(--sh)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--pr)}
.login-logo p{color:var(--t2);font-size:.9rem;margin-top:4px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--t2);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:10px;font-size:.95rem;font-family:'DM Sans',sans-serif;outline:none;background:var(--sf)}
input:focus,select:focus{border-color:var(--pr)}
.btn{padding:14px 24px;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;margin-top:12px}
.btn-p{background:var(--pr);color:#fff}.btn-g{background:var(--ac);color:#fff}.btn-s{background:var(--ok);color:#fff}.btn-b{background:var(--bd);color:var(--tx)}
.btn-sm{padding:8px 16px;font-size:.82rem;width:auto;margin:0}
.err{color:var(--er);font-size:.85rem;text-align:center;margin-top:8px;font-weight:600}
.ok{color:var(--ok);font-size:.85rem;text-align:center;margin-top:8px;font-weight:600}
#app{display:none;min-height:100vh;padding-bottom:60px}
.hdr{background:var(--pr);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:50}
.hdr h1{font-family:'Playfair Display',serif;font-size:1.3rem}
.hdr p{font-size:.78rem;opacity:.75;margin-top:2px}
.main{padding:16px}
.sec{background:var(--sf);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.sec h3{font-size:.95rem;font-weight:700;margin-bottom:12px;color:var(--pr)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.dash{background:var(--sf);border-radius:var(--r);padding:16px;box-shadow:var(--sh);text-align:center}
.dash .val{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--pr)}
.dash .lbl{font-size:.75rem;color:var(--t2);margin-top:4px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);display:flex;justify-content:space-around;padding:8px 0;box-shadow:0 -2px 16px rgba(0,0,0,.08);z-index:100;border-top:1px solid var(--bd);overflow-x:auto}
.bn{display:flex;flex-direction:column;align-items:center;background:none;border:none;color:var(--t3);font-size:.62rem;cursor:pointer;padding:4px 8px;gap:2px;white-space:nowrap}
.bn.on{color:var(--pr)}
.bn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd)}
th{background:var(--bg);font-weight:700;color:var(--t2);font-size:.72rem;text-transform:uppercase}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.tag-ok{background:#ECFDF5;color:var(--ok)}.tag-er{background:#FEF2F2;color:var(--er)}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:8px;font-size:.85rem}
.alert-w{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E}
.alert-e{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-row select{flex:1;min-width:120px}
.cart{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:12px;margin:12px 0}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.85rem}
.cart-item:last-child{border-bottom:none}
.cart-item button{background:var(--er);color:#fff;border:none;border-radius:6px;padding:2px 8px;font-size:.75rem;cursor:pointer;margin-left:8px}
.cart-total{font-weight:700;font-size:1rem;text-align:right;padding-top:8px;border-top:2px solid var(--bd);margin-top:8px}
.cart-add{display:flex;gap:8px;align-items:flex-end;margin:12px 0;flex-wrap:wrap}
.cart-add select{flex:2;min-width:150px}
.cart-add input{flex:1;min-width:80px}
.cart-add button{flex-shrink:0;padding:12px 18px}
@media(max-width:380px){.cards{grid-template-columns:1fr}.cart-add{flex-direction:column}}
</style>
</head>
<body>

<div id="login">
<div class="login-box">
<div class="login-logo"><h1>DUAVA Tania</h1><p>Gestion Empresarial</p></div>
<label>Clave de acceso</label>
<input type="password" id="pwd" placeholder="Ingrese su clave" onkeydown="if(event.key==='Enter')doLogin()">
<div id="loginErr" class="err"></div>
<button class="btn btn-p" onclick="doLogin()">Ingresar</button>
</div>
</div>

<div id="app">
<div class="hdr"><h1>DUAVA Tania Empresa</h1><p id="hdrSub">Gestion Empresarial</p></div>
<div class="main" id="main"></div>
<div class="bnav" id="bnav"></div>
</div>

<script>
var GAS='https://script.google.com/macros/s/AKfycbyyLKn5GCPiNWartuxOgPhSzXgv5G5rhzpXfm_JPtxC9baSmmauPwbHTRqFS_U50WB1/exec';
var TOKEN='',USER={},CFG={},VIEW='dash';
var CART=[];

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

async function api(action,data){
  try{
    if(data&&action.indexOf('get')!==0){
      data.action=action;data.token=TOKEN;
      var r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
      return await r.json();
    }else{
      var url=GAS+'?action='+action+'&token='+TOKEN;
      if(data){for(var k in data){url+='&'+k+'='+encodeURIComponent(data[k])}}
      return await(await fetch(url)).json();
    }
  }catch(e){return{error:'Error de conexion: '+e.message}}
}

async function doLogin(){
  var c=document.getElementById('pwd').value;
  if(!c){document.getElementById('loginErr').textContent='Ingrese su clave';return}
  document.getElementById('loginErr').textContent='Cargando...';
  var r=await api('login',{clave:c});
  if(r.error){document.getElementById('loginErr').textContent=r.error;return}
  TOKEN=r.token;USER=r.user;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').style.display='block';
  document.getElementById('hdrSub').textContent=USER.nombre+' · '+USER.rol;
  var cr=await api('getCompany');CFG=cr.config||{};
  buildNav();go('dash');
}

function buildNav(){
  var items=[{id:'dash',label:'Inicio',icon:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z'},{id:'prod',label:'Productos',icon:'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4'},{id:'sales',label:'Ventas',icon:'M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6'},{id:'comp',label:'Compras',icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'},{id:'rep',label:'Informes',icon:'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z'},{id:'obl',label:'Obligaciones',icon:'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z'}];
  if(USER.rol==='Gerencia'){items.push({id:'gast',label:'Gastos',icon:'M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z'})}
  items.push({id:'out',label:'Salir',icon:'M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1'});
  var h='';items.forEach(function(it){h+='<button class="bn'+(it.id===VIEW?' on':'')+'" onclick="go(\''+it.id+'\')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="'+it.icon+'"/></svg>'+it.label+'</button>'});
  document.getElementById('bnav').innerHTML=h;
}

function go(v){
  if(v==='out'){TOKEN='';USER={};document.getElementById('app').style.display='none';document.getElementById('login').classList.remove('hidden');document.getElementById('pwd').value='';return}
  VIEW=v;CART=[];buildNav();
  if(v==='dash')showDash();
  else if(v==='prod')showProducts();
  else if(v==='sales')showSales();
  else if(v==='comp')showPurchases();
  else if(v==='rep')showReport();
  else if(v==='obl')showObligations();
  else if(v==='gast')showExpenses();
}

async function showDash(){
  document.getElementById('main').innerHTML='<div class="sec">Cargando...</div>';
  var r=await api('getDashboard');
  if(r.error){document.getElementById('main').innerHTML='<div class="sec"><div class="err">'+esc(r.error)+'</div></div>';return}
  var h='<div class="cards">';
  h+='<div class="dash"><div class="val">Bs '+r.ventasHoy.toFixed(2)+'</div><div class="lbl">Ventas Hoy ('+r.numVentasHoy+')</div></div>';
  h+='<div class="dash"><div class="val">Bs '+r.ventasMes.toFixed(2)+'</div><div class="lbl">Ventas Mes ('+r.numVentasMes+')</div></div>';
  if(USER.rol==='Gerencia'){
    h+='<div class="dash"><div class="val" style="color:var(--ok)">Bs '+r.gananciaMes.toFixed(2)+'</div><div class="lbl">Ganancia Mes</div></div>';
    h+='<div class="dash"><div class="val" style="color:var(--er)">Bs '+r.gastosMes.toFixed(2)+'</div><div class="lbl">Gastos Mes</div></div>';
  }
  h+='</div>';
  if(r.stockBajo&&r.stockBajo.length){h+='<div class="sec"><h3>Stock Bajo</h3>';r.stockBajo.forEach(function(s){h+='<div class="alert alert-w">'+esc(s.nombre)+' — Stock: '+s.stock+' / Minimo: '+s.minimo+'</div>'});h+='</div>'}
  if(r.proximasOblig&&r.proximasOblig.length){h+='<div class="sec"><h3>Proximas Obligaciones</h3>';r.proximasOblig.forEach(function(o){var cls=o.dias<=3?'alert-e':'alert-w';h+='<div class="alert '+cls+'">'+esc(o.obligacion)+' — '+esc(o.periodo)+' — Vence: '+o.fecha+' ('+o.dias+' dias)</div>'});h+='</div>'}
  document.getElementById('main').innerHTML=h;
}

async function showProducts(){
  document.getElementById('main').innerHTML='<div class="sec">Cargando...</div>';
  var r=await api('getProducts');
  if(r.error){document.getElementById('main').innerHTML='<div class="sec"><div class="err">'+esc(r.error)+'</div></div>';return}
  var h='';
  if(USER.rol==='Gerencia'){
    h+='<div class="sec"><h3>Agregar Producto</h3>';
    h+='<label>Nombre</label><input id="np-nom" placeholder="Nombre del producto">';
    h+='<label>Codigo</label><input id="np-cod" placeholder="Ej: DEN-001">';
    h+='<label>Descripcion</label><input id="np-desc" placeholder="Ej: Opallis Flow x 2gr">';
    h+='<label>Marca</label><input id="np-mar" placeholder="Marca">';
    h+='<label>Categoria</label><input id="np-cat" placeholder="Ej: Resinas, Equipos">';
    h+='<label>Unidad</label><select id="np-unid"><option>Unidad</option><option>Jeringa</option><option>Caja</option><option>Par</option><option>Kit</option><option>Metro</option><option>Bobina</option><option>Otro</option></select>';
    h+='<div class="cards" style="margin-top:12px">';
    h+='<div><label>Costo Compra (Bs)</label><input type="number" id="np-cost" step="0.01"></div>';
    h+='<div><label>Precio Venta (Bs)</label><input type="number" id="np-prev" step="0.01"></div>';
    h+='<div><label>Precio Mayorista (Bs)</label><input type="number" id="np-prem" step="0.01"></div>';
    h+='<div><label>Stock Minimo</label><input type="number" id="np-min"></div>';
    h+='<div><label>Vencimiento</label><input type="date" id="np-venc"></div>';
    h+='<div><label>Estado</label><select id="np-est"><option>Activo</option><option>Inactivo</option></select></div>';
    h+='</div>';
    h+='<label>Observaciones</label><input id="np-obs" placeholder="Notas adicionales">';
    h+='<button class="btn btn-g" onclick="addProduct()">Guardar Producto</button>';
    h+='<div id="np-msg" class="ok"></div></div>';
  }
  h+='<div class="sec"><h3>Productos ('+r.productos.length+')</h3>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>Nombre</th><th>Descripcion</th><th>Marca</th><th>Unidad</th><th>Precio</th><th>Stock</th>';
  if(USER.rol==='Gerencia')h+='<th>Costo</th><th>Mayorista</th>';
  h+='<th>Estado</th></tr></thead><tbody>';
  r.productos.forEach(function(p){
    var stk=p.stock<=p.stockMinimo?'<span class="tag tag-er">'+p.stock+'</span>':p.stock;
    var est=p.estado==='Activo'?'<span class="tag tag-ok">Activo</span>':'<span class="tag tag-er">Inactivo</span>';
    h+='<tr><td>'+esc(p.nombre)+'</td><td>'+esc(p.descripcion||'-')+'</td><td>'+esc(p.marca)+'</td><td>'+esc(p.unidad||'-')+'</td><td>Bs '+p.precioVenta.toFixed(2)+'</td><td>'+stk+'</td>';
    if(USER.rol==='Gerencia')h+='<td>Bs '+(p.costoCompra||0).toFixed(2)+'</td><td>Bs '+(p.precioMayorista||0).toFixed(2)+'</td>';
    h+='<td>'+est+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('main').innerHTML=h;
}

async function addProduct(){
  var d={nombre:document.getElementById('np-nom').value,codigo:document.getElementById('np-cod').value,descripcion:document.getElementById('np-desc').value,marca:document.getElementById('np-mar').value,categoria:document.getElementById('np-cat').value,unidad:document.getElementById('np-unid').value,costoCompra:document.getElementById('np-cost').value,precioVenta:document.getElementById('np-prev').value,precioMayorista:document.getElementById('np-prem').value,stockMinimo:document.getElementById('np-min').value,vencimiento:document.getElementById('np-venc').value,estado:document.getElementById('np-est').value,observaciones:document.getElementById('np-obs').value};
  if(!d.nombre){document.getElementById('np-msg').className='err';document.getElementById('np-msg').textContent='Nombre requerido';return}
  var r=await api('createProduct',d);
  if(r.error){document.getElementById('np-msg').className='err';document.getElementById('np-msg').textContent=r.error;return}
  document.getElementById('np-msg').className='ok';document.getElementById('np-msg').textContent='Producto creado: '+r.id;
  setTimeout(showProducts,1000);
}

function renderCart(){
  var el=document.getElementById('cart-list');
  if(!el)return;
  if(!CART.length){el.innerHTML='<p style="color:var(--t3);font-size:.85rem;padding:8px">Sin productos agregados</p>';return}
  var h='';var total=0;
  CART.forEach(function(it,i){
    var sub=it.precio*it.cantidad;total+=sub;
    h+='<div class="cart-item"><span>'+esc(it.producto)+' × '+it.cantidad+' = <strong>Bs '+sub.toFixed(2)+'</strong></span><button onclick="removeCart('+i+')">X</button></div>';
  });
  h+='<div class="cart-total">TOTAL: Bs '+total.toFixed(2)+'</div>';
  el.innerHTML=h;
}

function addCart(){
  var sel=document.getElementById('cart-prod');
  var cant=parseInt(document.getElementById('cart-cant').value)||1;
  var prec=parseFloat(document.getElementById('cart-prec').value)||0;
  if(!sel.value){return}
  var opt=sel.options[sel.selectedIndex];
  CART.push({idProducto:sel.value,producto:opt.text,cantidad:cant,precio:prec});
  document.getElementById('cart-cant').value=1;
  renderCart();
}

function removeCart(i){CART.splice(i,1);renderCart()}

async function showSales(){
  document.getElementById('main').innerHTML='<div class="sec">Cargando...</div>';
  var pr=await api('getProducts');
  var sr=await api('getSales',{filtro:'todo'});
  if(sr.error){document.getElementById('main').innerHTML='<div class="sec"><div class="err">'+esc(sr.error)+'</div></div>';return}
  var prods=pr.productos||[];
  CART=[];
  var h='';
  h+='<div class="sec"><h3>Registrar Venta</h3>';
  h+='<label>Cliente</label><input id="ns-cli" placeholder="Nombre del cliente">';
  h+='<div class="cards" style="margin-top:12px">';
  h+='<div><label>NIT / Carnet</label><input id="ns-nit" placeholder="NIT o CI"></div>';
  h+='<div><label>Tipo Documento</label><select id="ns-tdoc"><option>Factura</option><option>Nota de Venta</option></select></div>';
  h+='<div><label>N Factura</label><input id="ns-nfact" placeholder="Ej: 000123"></div>';
  h+='<div><label>Forma de Pago</label><select id="ns-fpago"><option>Efectivo</option><option>Transferencia</option><option>QR</option><option>Otro</option></select></div>';
  h+='</div>';
  h+='<h3 style="margin-top:16px">Productos de la venta</h3>';
  h+='<div class="cart-add">';
  h+='<select id="cart-prod" onchange="fillCartPrice()"><option value="">Seleccione producto...</option>';
  prods.forEach(function(p){if(p.stock>0)h+='<option value="'+p.id+'" data-precio="'+p.precioVenta+'">'+esc(p.nombre)+' (Stock:'+p.stock+')</option>'});
  h+='</select>';
  h+='<input type="number" id="cart-cant" value="1" min="1" placeholder="Cant.">';
  h+='<input type="number" id="cart-prec" placeholder="Precio" step="0.01">';
  h+='<button class="btn btn-g btn-sm" onclick="addCart()">+ Agregar</button>';
  h+='</div>';
  h+='<div class="cart" id="cart-list"></div>';
  h+='<button class="btn btn-s" onclick="confirmSale()">Confirmar Venta</button>';
  h+='<div id="ns-msg"></div></div>';
  h+='<div class="sec"><h3>Historial de Ventas</h3>';
  h+='<div class="filter-row">';
  h+='<select id="sales-filtro" onchange="loadSales()">';
  h+='<option value="dia">Dia de Hoy</option>';
  h+='<option value="semana">Ultima Semana</option>';
  h+='<option value="mes_actual">Mes Actual</option>';
  h+='<option value="mes_anterior">Mes Anterior</option>';
  h+='<option value="anio">Ano Completo</option>';
  h+='<option value="todo" selected>Todo</option>';
  h+='</select>';
  h+='<select id="sales-anio"><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>';
  h+='</div>';
  h+='<div id="sales-historial">';
  if(!sr.ventas||!sr.ventas.length)h+='<p style="color:var(--t3)">Sin ventas registradas</p>';
  else{h+=salesTable(sr.ventas)}
  h+='</div></div>';
  document.getElementById('main').innerHTML=h;
  renderCart();
}

function salesTable(ventas){
  var h='<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Productos</th><th>Total</th><th>Doc</th><th>Cliente</th></tr></thead><tbody>';
  ventas.forEach(function(v){h+='<tr><td>'+v.fecha+'</td><td>'+esc(v.productos||v.producto||'')+'</td><td>Bs '+v.total.toFixed(2)+'</td><td>'+esc(v.tipoDocumento)+'</td><td>'+esc(v.cliente)+'</td></tr>'});
  h+='</tbody></table></div>';
  return h;
}

function fillCartPrice(){
  var sel=document.getElementById('cart-prod');
  var opt=sel.options[sel.selectedIndex];
  document.getElementById('cart-prec').value=opt.getAttribute('data-precio')||'';
}

async function confirmSale(){
  if(!CART.length){document.getElementById('ns-msg').innerHTML='<div class="err">Agregue al menos un producto</div>';return}
  var d={items:CART.map(function(it){return{idProducto:it.idProducto,producto:it.producto,cantidad:it.cantidad,precioUnitario:it.precio}}),cliente:document.getElementById('ns-cli').value,nitCliente:document.getElementById('ns-nit').value,tipoDocumento:document.getElementById('ns-tdoc').value,numeroFactura:document.getElementById('ns-nfact').value,formaPago:document.getElementById('ns-fpago').value};
  var r=await api('registerSale',d);
  if(r.error){document.getElementById('ns-msg').innerHTML='<div class="err">'+esc(r.error)+'</div>';return}
  document.getElementById('ns-msg').innerHTML='<div class="ok">Venta registrada: Bs '+r.total.toFixed(2)+' | Ganancia: Bs '+r.ganancia.toFixed(2)+'</div>';
  CART=[];
  setTimeout(showSales,1500);
}

async function loadSales(){
  var f=document.getElementById('sales-filtro').value;
  var a=document.getElementById('sales-anio').value;
  var params={filtro:f};if(f==='anio')params.anio=a;
  var r=await api('getSales',params);
  if(r.error)return;
  var h=(r.ventas&&r.ventas.length)?salesTable(r.ventas):'<p style="color:var(--t3)">Sin ventas en este periodo</p>';
  var el=document.getElementById('sales-historial');if(el)el.innerHTML=h;
}

async function showPurchases(){
  if(USER.rol!=='Gerencia'){document.getElementById('main').innerHTML='<div class="sec"><div class="err">No autorizado</div></div>';return}
  document.getElementById('main').innerHTML='<div class="sec">Cargando...</div>';
  var pr=await api('getProducts');
  var cr=await api('getPurchases',{});
  var prods=pr.productos||[];
  CART=[];
  var h='';
  h+='<div class="sec"><h3>Registrar Compra</h3>';
  h+='<label>Proveedor</label><input id="nc-prov" placeholder="Nombre del proveedor">';
  h+='<div class="cards" style="margin-top:12px">';
  h+='<div><label>NIT Proveedor</label><input id="nc-nit" placeholder="NIT del proveedor"></div>';
  h+='<div><label>N Factura Compra</label><input id="nc-fact" placeholder="Ej: FAC-001"></div>';
  h+='<div><label>Forma de Pago</label><select id="nc-fpago"><option>Efectivo</option><option>Transferencia</option><option>Credito</option></select></div>';
  h+='<div><label>Estado Pago</label><select id="nc-epago"><option>Pagado</option><option>Pendiente</option></select></div>';
  h+='</div>';
  h+='<h3 style="margin-top:16px">Productos de la compra</h3>';
  h+='<div class="cart-add">';
  h+='<select id="cart-prod" onchange="fillCartPrice()"><option value="">Seleccione producto...</option>';
  prods.forEach(function(p){h+='<option value="'+p.id+'" data-precio="'+(p.costoCompra||0)+'">'+esc(p.nombre)+'</option>'});
  h+='</select>';
  h+='<input type="number" id="cart-cant" value="1" min="1" placeholder="Cant.">';
  h+='<input type="number" id="cart-prec" placeholder="Costo/u" step="0.01">';
  h+='<button class="btn btn-g btn-sm" onclick="addCart()">+ Agregar</button>';
  h+='</div>';
  h+='<div class="cart" id="cart-list"></div>';
  h+='<button class="btn btn-s" onclick="confirmPurchase()">Confirmar Compra</button>';
  h+='<div id="nc-msg"></div></div>';
  h+='<div class="sec"><h3>Historial de Compras</h3>';
  if(!cr.compras||!cr.compras.length)h+='<p style="color:var(--t3)">Sin compras registradas</p>';
  else{
    h+='<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Proveedor</th><th>Productos</th><th>Factura</th><th>Total</th></tr></thead><tbody>';
    cr.compras.forEach(function(c){h+='<tr><td>'+c.fecha+'</td><td>'+esc(c.proveedor)+'</td><td>'+esc(c.productos)+'</td><td>'+esc(c.documentoFactura)+'</td><td>Bs '+c.costoTotal.toFixed(2)+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  h+='</div>';
  document.getElementById('main').innerHTML=h;
  renderCart();
}

async function confirmPurchase(){
  if(!CART.length){document.getElementById('nc-msg').innerHTML='<div class="err">Agregue al menos un producto</div>';return}
  var d={items:CART.map(function(it){return{idProducto:it.idProducto,producto:it.producto,cantidad:it.cantidad,costoUnitario:it.precio}}),proveedor:document.getElementById('nc-prov').value,nitProveedor:document.getElementById('nc-nit').value,documentoFactura:document.getElementById('nc-fact').value,formaPago:document.getElementById('nc-fpago').value,estadoPago:document.getElementById('nc-epago').value};
  var r=await api('registerPurchase',d);
  if(r.error){document.getElementById('nc-msg').innerHTML='<div class="err">'+esc(r.error)+'</div>';return}
  document.getElementById('nc-msg').innerHTML='<div class="ok">Compra registrada: '+r.id+' — Total: Bs '+r.total.toFixed(2)+'</div>';
  CART=[];
  setTimeout(showPurchases,1500);
}

async function showReport(){
  if(USER.rol!=='Gerencia'){document.getElementById('main').innerHTML='<div class="sec"><div class="err">No autorizado</div></div>';return}
  document.getElementById('main').innerHTML='<div class="sec">Cargando...</div>';
  var r=await api('getReport',{filtro:'mes_actual'});
  if(r.error){document.getElementById('main').innerHTML='<div class="sec"><div class="err">'+esc(r.error)+'</div></div>';return}
  var h='<div class="sec"><h3>Informe de Ventas y Ganancias</h3>';
  h+='<div class="filter-row">';
  h+='<select id="rep-filtro" onchange="loadReport()">';
  h+='<option value="dia">Dia de Hoy</option>';
  h+='<option value="semana">Ultima Semana</option>';
  h+='<option value="mes_actual" selected>Mes Actual</option>';
  h+='<option value="mes_anterior">Mes Anterior</option>';
  h+='<option value="anio">Ano Completo</option>';
  h+='</select>';
  h+='<select id="rep-anio"><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>';
  h+='</div>';
  h+='<div id="rep-content">'+reportContent(r)+'</div></div>';
  document.getElementById('main').innerHTML=h;
}

function reportContent(r){
  var h='<div class="cards">';
  h+='<div class="dash"><div class="val">Bs '+r.totalVentas.toFixed(2)+'</div><div class="lbl">Total Ventas</div></div>';
  h+='<div class="dash"><div class="val" style="color:var(--ok)">Bs '+r.totalGanancia.toFixed(2)+'</div><div class="lbl">Ganancia Bruta</div></div>';
  h+='<div class="dash"><div class="val" style="color:var(--er)">Bs '+r.totalGastos.toFixed(2)+'</div><div class="lbl">Gastos</div></div>';
  h+='<div class="dash"><div class="val" style="color:'+(r.gananciaNeta>=0?'var(--ok)':'var(--er)')+'">Bs '+r.gananciaNeta.toFixed(2)+'</div><div class="lbl">Ganancia Neta</div></div>';
  h+='<div class="dash"><div class="val">'+r.numVentas+'</div><div class="lbl">Unidades</div></div>';
  h+='<div class="dash"><div class="val">'+r.margen+'%</div><div class="lbl">Margen</div></div>';
  h+='</div>';
  if(r.detalle&&r.detalle.length){
    h+='<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Fecha</th><th>Productos</th><th>Total</th><th>Ganancia</th></tr></thead><tbody>';
    r.detalle.forEach(function(v){h+='<tr><td>'+v.fecha+'</td><td>'+esc(v.productos||'')+'</td><td>Bs '+v.total.toFixed(2)+'</td><td style="color:'+(v.ganancia>=0?'var(--ok)':'var(--er)')+'">Bs '+v.ganancia.toFixed(2)+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  return h;
}

async function loadReport(){
  var f=document.getElementById('rep-filtro').value;
  var a=document.getElementById('rep-anio').value;
  var params={filtro:f};if(f==='anio')params.anio=a;
  var r=await api('getReport',params);
  if(r.error)return;
  var el=document.getElementById('rep-content');if(el)el.innerHTML=reportContent(r);
}

async function showObligations(){
  document.getElementById('main').innerHTML='<div class="sec">Cargando...</div>';
  var r=await api('getObligations');
  if(r.error){document.getElementById('main').innerHTML='<div class="sec"><div class="err">'+esc(r.error)+'</div></div>';return}
  var h='<div class="sec"><h3>Obligaciones Tributarias</h3>';
  if(!r.obligaciones||!r.obligaciones.length)h+='<p style="color:var(--t3)">Sin obligaciones configuradas. Agregue datos en Google Sheets (pestana OBLIGACIONES).</p>';
  else{
    r.obligaciones.forEach(function(o){
      var cls=o.estado==='Cumplida'?'tag-ok':'tag-er';
      h+='<div class="sec" style="margin-bottom:8px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center"><strong>'+esc(o.obligacion)+'</strong><span class="tag '+cls+'">'+esc(o.estado)+'</span></div>';
      h+='<div style="font-size:.82rem;color:var(--t2);margin-top:6px">Periodo: '+esc(o.periodo)+' | Vence: '+o.fecha+' | Responsable: '+esc(o.responsable)+'</div>';
      if(o.url)h+='<a href="'+esc(o.url)+'" target="_blank" style="font-size:.78rem;color:var(--pr);font-weight:600">Ver fuente oficial</a>';
      if(USER.rol==='Gerencia'){
        h+='<div style="margin-top:8px;display:flex;gap:6px">';
        h+='<button class="btn btn-b btn-sm" onclick="markOblig(\''+o.id+'\',\'Cumplida\')">Marcar Cumplida</button>';
        h+='<button class="btn btn-b btn-sm" onclick="markOblig(\''+o.id+'\',\'En Preparacion\')">En Preparacion</button>';
        h+='</div>';
      }
      h+='</div>';
    });
  }
  h+='</div>';
  document.getElementById('main').innerHTML=h;
}

async function markOblig(id,estado){await api('updateObligation',{id:id,estado:estado});showObligations()}

async function showExpenses(){
  if(USER.rol!=='Gerencia'){document.getElementById('main').innerHTML='<div class="sec"><div class="err">No autorizado</div></div>';return}
  document.getElementById('main').innerHTML='<div class="sec">Cargando...</div>';
  var r=await api('getExpenses',{filtro:'mes_actual'});
  if(r.error){document.getElementById('main').innerHTML='<div class="sec"><div class="err">'+esc(r.error)+'</div></div>';return}
  var h='';
  h+='<div class="sec"><h3>Registrar Gasto</h3>';
  h+='<label>Descripcion</label><input id="ng-desc" placeholder="Descripcion del gasto">';
  h+='<div class="cards" style="margin-top:12px">';
  h+='<div><label>Monto (Bs)</label><input type="number" id="ng-monto" step="0.01"></div>';
  h+='<div><label>Categoria</label><select id="ng-cat"><option>General</option><option>Transporte</option><option>Alquiler</option><option>Servicios</option><option>Impuestos</option><option>Otro</option></select></div>';
  h+='<div><label>Beneficiario</label><input id="ng-benef"></div>';
  h+='<div><label>Documento</label><input id="ng-doc"></div>';
  h+='</div>';
  h+='<button class="btn btn-g" onclick="addExpense()">Registrar Gasto</button>';
  h+='<div id="ng-msg"></div></div>';
  h+='<div class="sec"><h3>Historial de Gastos</h3>';
  h+='<div class="filter-row">';
  h+='<select id="gast-filtro" onchange="loadExpenses()">';
  h+='<option value="dia">Dia de Hoy</option>';
  h+='<option value="semana">Ultima Semana</option>';
  h+='<option value="mes_actual" selected>Mes Actual</option>';
  h+='<option value="mes_anterior">Mes Anterior</option>';
  h+='<option value="anio">Ano Completo</option>';
  h+='</select>';
  h+='<select id="gast-anio"><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option></select>';
  h+='</div>';
  h+='<div id="gast-historial">'+expensesTable(r.gastos)+'</div></div>';
  document.getElementById('main').innerHTML=h;
}

function expensesTable(gastos){
  if(!gastos||!gastos.length)return '<p style="color:var(--t3)">Sin gastos registrados</p>';
  var total=0;
  var h='<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Descripcion</th><th>Categoria</th><th>Monto</th><th>Beneficiario</th></tr></thead><tbody>';
  gastos.forEach(function(g){total+=g.monto;h+='<tr><td>'+g.fecha+'</td><td>'+esc(g.descripcion)+'</td><td>'+esc(g.categoria)+'</td><td>Bs '+g.monto.toFixed(2)+'</td><td>'+esc(g.beneficiario)+'</td></tr>'});
  h+='<tr><td colspan="3"><strong>TOTAL</strong></td><td><strong>Bs '+total.toFixed(2)+'</strong></td><td></td></tr>';
  h+='</tbody></table></div>';
  return h;
}

async function loadExpenses(){
  var f=document.getElementById('gast-filtro').value;
  var a=document.getElementById('gast-anio').value;
  var params={filtro:f};if(f==='anio')params.anio=a;
  var r=await api('getExpenses',params);
  if(r.error)return;
  var el=document.getElementById('gast-historial');if(el)el.innerHTML=expensesTable(r.gastos);
}

async function addExpense(){
  var d={descripcion:document.getElementById('ng-desc').value,monto:document.getElementById('ng-monto').value,categoria:document.getElementById('ng-cat').value,beneficiario:document.getElementById('ng-benef').value,documento:document.getElementById('ng-doc').value};
  if(!d.descripcion||!d.monto){document.getElementById('ng-msg').innerHTML='<div class="err">Complete descripcion y monto</div>';return}
  var r=await api('registerExpense',d);
  if(r.error){document.getElementById('ng-msg').innerHTML='<div class="err">'+esc(r.error)+'</div>';return}
  document.getElementById('ng-msg').innerHTML='<div class="ok">Gasto registrado</div>';
  setTimeout(showExpenses,1500);
}
</script>
